name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # secrets.* can't be referenced directly in a step "if:" expression —
      # mirror it into env so the Qualflare step below can check for it.
      QUALFLARE_TOKEN: ${{ secrets.QUALFLARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build server
        working-directory: server
        run: go build ./...

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Install Playwright browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: dashboard
        run: npm run test:e2e

      - name: Upload results to Qualflare
        # Only report from pushes to the head branch, never PRs — PR runs
        # (fork or not) are more noise than signal for this, and fork PRs
        # never get repository secrets anyway (GitHub withholds them
        # regardless of the secret being configured on the base repo).
        if: always() && github.event_name == 'push' && env.QUALFLARE_TOKEN != ''
        uses: Qualflare/qualflare-action@v1
        env:
          QF_ENVIRONMENT: staging
        with:
          token: ${{ env.QUALFLARE_TOKEN }}
          project: kast
          results: dashboard/e2e-results.xml
